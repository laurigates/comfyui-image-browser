name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint & format (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Ruff check
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  lint-js:
    name: Lint & format (TypeScript/JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Pin to the schema version declared in biome.json. Bump in lockstep
          # with a config migration via `biome migrate` when upgrading.
          version: 2.4.15
      - name: Biome check
        run: biome check .

  typecheck-build:
    name: Typecheck & build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Verify committed web/dist is up to date
        run: |
          if ! git diff --exit-code -- web/dist; then
            echo "::error::web/dist is stale vs src/. Run 'bun run build' and commit web/dist."
            exit 1
          fi

  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Run tests
        run: uv run --group dev pytest -v

  test-js:
    name: Tests (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bun run test

  test-e2e:
    # The browser suite. Its own job on purpose: it needs a Chromium download
    # that no other job wants, and as a parallel job it adds nothing to the
    # critical path — bolted onto `test-js` it would roughly triple that job.
    # It is also the ONLY suite that can see the scroll-restore regressions:
    # jsdom does no layout, so it neither clamps `scrollTop` nor answers 0 from
    # a detached element. Measured: reverting src/browser.ts to the pre-fix
    # version fails 10 of the 25 tests here while `bun run test` stays 39/39 and
    # `pytest` 186/186 green.
    name: Tests (browser, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Chromium only — the suite declares a single chromium project, and the
        # other engines are a download this job would never use.
        run: bunx playwright install --with-deps chromium
      - name: Build the served bundle
        # The fixture serves web/dist/index.js at its real extension URL, so the
        # suite must run against a bundle built from this commit's src/. (That
        # the COMMITTED web/dist matches src/ is typecheck-build's assertion,
        # not this job's.)
        run: bun run build
      - name: Run the browser suite
        run: bun run test:e2e
      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  vendored-drift:
    name: Vendored modules match canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff xmp_meta.py against comfyui-gallery-loader@main
        run: |
          curl -fsSL https://raw.githubusercontent.com/laurigates/comfyui-gallery-loader/main/xmp_meta.py | diff -u - xmp_meta.py || {
            echo "::error::xmp_meta.py drifted from its canonical home (comfyui-gallery-loader). Run 'just sync-xmp' — or land the fix upstream first."
            exit 1
          }
      - name: Diff thumb_cache.py against comfyui-gallery-loader@main
        run: |
          curl -fsSL https://raw.githubusercontent.com/laurigates/comfyui-gallery-loader/main/thumb_cache.py | diff -u - thumb_cache.py || {
            echo "::error::thumb_cache.py drifted from its canonical home (comfyui-gallery-loader). Run 'just sync-thumb-cache' — or land the fix upstream first."
            exit 1
          }
      - name: Diff pins_store.py against comfyui-gallery-loader@main
        run: |
          curl -fsSL https://raw.githubusercontent.com/laurigates/comfyui-gallery-loader/main/pins_store.py | diff -u - pins_store.py || {
            echo "::error::pins_store.py drifted from its canonical home (comfyui-gallery-loader). Run 'just sync-pins-store' — or land the fix upstream first."
            exit 1
          }

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # gitleaks scans <prev>^..<head>; the parent commit must be present
          # locally, so a shallow clone fails with "stderr is not empty".
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
